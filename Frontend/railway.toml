# Railway — static React SPA (set service Root Directory to Frontend)
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "serve dist -l tcp://0.0.0.0:$PORT -s"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
