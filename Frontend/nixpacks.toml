[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_CACHE = "/tmp/npm-cache"
NPM_CONFIG_UPDATE_NOTIFIER = "false"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["mkdir -p /tmp/npm-cache", "npm ci --include=dev --cache /tmp/npm-cache"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx --yes serve dist -l tcp://0.0.0.0:$PORT -s"
