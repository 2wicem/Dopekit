[build]
builder = "nixpacks"
buildCommand = "cd Backend && python -m venv .venv && .venv/bin/pip install --upgrade pip && .venv/bin/pip install -r requirements.txt && .venv/bin/python manage.py collectstatic --noinput"

[deploy]
startCommand = "cd Backend && .venv/bin/python manage.py migrate --noinput && .venv/bin/gunicorn bootstrap.wsgi:application --config gunicorn.conf.py"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/products/"
healthcheckTimeout = 120
