[phases.setup]
nixPkgs = ["python312", "postgresql"]

[phases.install]
cmds = [
  "python -m venv .venv",
  ".venv/bin/pip install --upgrade pip",
  ".venv/bin/pip install -r requirements.txt",
]

[phases.build]
cmds = [".venv/bin/python manage.py collectstatic --noinput"]

[start]
cmd = ".venv/bin/python manage.py migrate --noinput && .venv/bin/gunicorn bootstrap.wsgi:application --config gunicorn.conf.py"
